name: Package Tests

on:
  push:
    branches:
      - feature/tests

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run Package Tests
        id: run_tests
        env:
          DESTINATION: platform=iOS Simulator,name=iPhone 16
          RESULT_BUNDLE_PATH: .derivedData-tests/TestResults.xcresult
          TEST_LOG_PATH: .derivedData-tests/test-output.log
        run: Scripts/run-tests-with-coverage.sh

      - name: Extract Fixture Results
        if: always()
        run: |
          if [ -f .derivedData-tests/test-output.log ]; then
            python3 Scripts/extract-fixture-results.py .derivedData-tests/test-output.log .derivedData-tests/fixture-report.json
          fi

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -d .derivedData-tests/TestResults.xcresult ]; then
            python3 Scripts/write-test-summary.py .derivedData-tests/TestResults.xcresult .derivedData-tests/fixture-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Package Test Results"
              echo
              echo "No `.xcresult` bundle was generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Fixture JUnit Report
        if: always()
        run: |
          if [ -f .derivedData-tests/fixture-report.json ]; then
            python3 Scripts/write-junit-report.py .derivedData-tests/fixture-report.json .derivedData-tests/fixture-results.junit.xml
          fi

      - name: Publish Fixture JUnit Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Fixture Results
          path: .derivedData-tests/fixture-results.junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload XCResult Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-xcresult
          path: .derivedData-tests/TestResults.xcresult
          if-no-files-found: warn

      - name: Upload Fixture JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-junit-report
          path: .derivedData-tests/fixture-results.junit.xml
          if-no-files-found: warn
